spring.application.name=stock-service
server.port=8081

# kafka configuration
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# set KAFKA_ENABLED=false to run without a broker (no stock update or activity events are sent)
stock.kafka.enabled=${KAFKA_ENABLED:true}

# fr09 - stock update events
spring.cloud.stream.bindings.stockUpdates-out-0.destination=stock-updates
spring.cloud.stream.bindings.stockUpdates-out-0.content-type=application/json

# fr12 - book search and view activity events
spring.cloud.stream.bindings.bookActivity-out-0.destination=book-activity
spring.cloud.stream.bindings.bookActivity-out-0.content-type=application/json