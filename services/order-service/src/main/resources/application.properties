spring.application.name=order-service

server.port=8083

# h2 database
spring.datasource.url=jdbc:h2:file:./order-history;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create database tables automatically
spring.jpa.hibernate.ddl-auto=update

# enable h2 console
spring.h2.console.enabled=true

# kafka configuration
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# receive stock updates from kafka
spring.cloud.stream.bindings.stockUpdates-in-0.destination=stock-updates
spring.cloud.stream.bindings.stockUpdates-in-0.group=order-service
spring.cloud.stream.bindings.stockUpdates-in-0.content-type=application/json

# receive book activity events from kafka
spring.cloud.stream.bindings.bookActivity-in-0.destination=book-activity
spring.cloud.stream.bindings.bookActivity-in-0.group=trending-books
spring.cloud.stream.bindings.bookActivity-in-0.content-type=application/json

# activate both kafka consumers
spring.cloud.function.definition=stockUpdates;bookActivity