spring.application.name=chatbot-service

server.port=8085

# h2 database for saved conversations
spring.datasource.url=jdbc:h2:file:./chat-history;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create database tables automatically
spring.jpa.hibernate.ddl-auto=update

# enable h2 console
spring.h2.console.enabled=true

# claude model used by the chatbot (the api key comes from the environment, never from this file)
chatbot.anthropic.api-key=${ANTHROPIC_API_KEY:}
chatbot.anthropic.base-url=https://api.anthropic.com/v1/
chatbot.anthropic.model=claude-haiku-5-5
chatbot.anthropic.effort=low
chatbot.anthropic.max-tokens=2048
chatbot.anthropic.max-retries=2

# how many recent messages of each conversation are sent to claude
chatbot.memory.max-messages=20

# other bookstore services the chatbot reads from
chatbot.services.stock-url=http://localhost:8081
chatbot.services.cart-url=http://localhost:8082
chatbot.services.order-url=http://localhost:8083
